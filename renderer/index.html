<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;">
  <title>HELIOS</title>
  <link rel="icon" href="assets/helios-mark.svg" type="image/svg+xml">
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="kit.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#view">Ir para o conteúdo</a>
  <svg class="sb-sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="11" height="11" rx="2.5"/><path d="M14.5 10.5l6-3v9l-6-3"/></symbol>
    </defs>
  </svg>
  <div id="app" class="shell">
    <header class="top">
      <div class="brand">
        <span class="hx-mark hx-22" aria-hidden="true"></span>
        <span class="wordmark">HELIOS</span>
      </div>
      <p class="tag">Assistente de reuniões</p>
      <span class="grow"></span>
      <button type="button" class="icon-btn" id="btnTheme" title="Alternar tema" aria-label="Alternar tema"><svg class="sb-ico"><use href="#i-moon"/></svg></button>
      <button type="button" class="icon-btn" id="btnSettings" data-view="settings" title="Ajustes"><svg class="sb-ico"><use href="#i-gear"/></svg></button>
    </header>
    <p id="banner" class="banner hidden" role="status"></p>
    <div class="body">
      <aside class="rail" aria-label="Reuniões">
        <button type="button" class="primary" id="btnNew"><svg class="sb-ico"><use href="#i-plus"/></svg>Nova reunião</button>
        <p class="lbl">Anteriores</p>
        <div id="list" class="list"></div>
      </aside>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
