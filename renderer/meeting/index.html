<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:">
<title>HELIOS — Reunião</title>
<link rel="icon" href="../assets/helios-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grip" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></g></symbol>
  <symbol id="i-say" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-ask" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g></symbol>
  <symbol id="i-lines" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.6 5.2L19 10l-5.4 1.8L12 17l-1.6-5.2L5 10l5.4-1.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></g></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-through" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l6 16 2-7 7-2Z"/></g></symbol>
</svg>
<div id="root">
  <div id="pill">
    <span class="grip" aria-hidden="true"><svg><use href="#i-grip"/></svg></span>
    <button id="btnLogo" class="logo" type="button" aria-label="Mostrar ou esconder o painel"><span class="mark hx-mark" aria-hidden="true"></span></button>
    <span id="phase" class="phase">Pronto</span>
    <button id="btnStart" class="ib rec" type="button" aria-label="Ouvir ou pausar"><svg><use href="#i-mic"/></svg><span class="dot" id="dot"></span></button>
    <button id="btnEnd" class="end hidden" type="button" aria-label="Encerrar sessão">Encerrar <span id="timer" class="timer">00:00</span></button>
    <span id="ctBadge" class="ib ct hidden" aria-label="Atravessar cliques ligado"><svg><use href="#i-through"/></svg></span>
    <button id="btnMenu" class="ib" type="button" aria-label="Menu"><svg><use href="#i-dots"/></svg></button>
    <button id="btnHide" class="ib" type="button" aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
  </div>

  <div id="menu" class="menu hidden" role="menu">
    <button id="mTheme" type="button" role="menuitem">Tema</button>
    <label class="mrow"><span>Opacidade</span><input id="mOpacity" type="range" min="0.4" max="1" step="0.05"></label>
    <label class="mrow"><span>Microfone</span><input id="mMic" type="checkbox"></label>
    <p class="mnote">Pausar para o áudio. Encerrar libera captura, timers e pedidos à IA. Áudio do PC no Windows; no Linux costuma falhar.</p>
  </div>

  <div id="card" class="card hidden">
    <div id="chips" class="chips">
      <button id="chipInsights" class="chip on" type="button"><svg><use href="#i-spark"/></svg>Ajuda</button>
      <button id="chipTranscript" class="chip" type="button"><svg><use href="#i-lines"/></svg>Transcrição</button>
      <button id="chipSay" class="chip" type="button"><svg><use href="#i-say"/></svg>O que digo</button>
      <button id="chipAsk" class="chip" type="button"><svg><use href="#i-ask"/></svg>Perguntar</button>
      <span class="grow"></span>
      <button id="chipShot" class="chip ic" type="button" aria-label="Capturar tela da reunião"><svg><use href="#i-screen"/></svg></button>
    </div>
    <button id="chipQ" class="chip q hidden" type="button"><kbd>Tab</kbd><span id="chipQText"></span></button>
    <p id="voiceHint" class="voice-hint hidden" aria-live="polite"></p>
    <p id="screenHint" class="voice-hint hidden">Contexto de tela ligado só nesta sessão.</p>

    <div id="answer" class="answer hidden" aria-live="polite">
      <div id="ansAsk" class="ans-ask hidden"></div>
      <div id="ansMain" class="ans-main"></div>
      <div id="ansSub" class="ans-sub"></div>
      <div class="ans-tools"><button id="btnMore" class="mini hidden" type="button">Mais</button><button id="btnCopy" class="ib sm" type="button" aria-label="Copiar"><svg><use href="#i-copy"/></svg></button></div>
    </div>

    <div id="shotBox" class="shot hidden">
      <img id="shotImg" alt="Prévia da tela da reunião">
      <button id="btnShotSend" class="ib ok" type="button" aria-label="Usar este print"><svg><use href="#i-check"/></svg></button>
      <button id="btnShotCancel" class="ib" type="button" aria-label="Descartar print"><svg><use href="#i-x"/></svg></button>
    </div>

    <div id="transcript" class="transcript hidden"></div>

    <form id="askForm" class="ask">
      <input id="askInput" autocomplete="off" placeholder="Pergunte com base na conversa…">
      <button type="submit" class="ib" aria-label="Enviar"><svg><use href="#i-send"/></svg></button>
    </form>
  </div>
</div>
<script src="lineutil.js"></script>
<script src="app.js"></script>
</body>
</html>
