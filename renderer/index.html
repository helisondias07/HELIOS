<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;">
  <title>HELIOS</title>
  <link rel="icon" href="assets/helios-mark.svg" type="image/svg+xml">
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="kit.css">
</head>
<body>
  <a class="skip-link" href="#view">Ir para o conteúdo</a>
  <svg class="sb-sprite" aria-hidden="true" focusable="false">
    <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H11l-3.5 3v-3h-1a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13.5l2.5-8h11l2.5 8V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><path d="M4 13.5h4.5l1 2h5l1-2H20"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="10.5" rx="3"/><path d="M12 8V5.5"/><circle cx="12" cy="4.5" r="1"/><path d="M9.5 12.5v1.2M14.5 12.5v1.2"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M18.5 9A7 7 0 0 0 6.2 9.5"/><path d="M5 5.5v4h4"/><path d="M5.5 15A7 7 0 0 0 17.8 14.5"/><path d="M19 18.5v-4h-4"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3.5 12h4l2.5-6 4 12 2.5-6h4"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 4.5a3 3 0 0 0-3 3 3 3 0 0 0-1.5 5.3A3 3 0 0 0 9 17.5v2"/><path d="M15 4.5a3 3 0 0 1 3 3 3 3 0 0 1 1.5 5.3A3 3 0 0 1 15 17.5v2"/><path d="M12 5v14"/></symbol>
    <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="4" y="7.5" width="16" height="11.5" rx="2"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5"/><path d="M4 12.5h16"/></symbol>
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M5 6c0-1.1 3.1-2 7-2s7 .9 7 2-3.1 2-7 2-7-.9-7-2z"/><path d="M5 6v6c0 1.1 3.1 2 7 2s7-.9 7-2V6"/><path d="M5 12v6c0 1.1 3.1 2 7 2s7-.9 7-2v-6"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 14.5l3-4.5"/><circle cx="12" cy="14.5" r="1"/></symbol>
    <symbol id="i-vault" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="13.5" rx="2"/><circle cx="12" cy="11.75" r="3"/><path d="M12 9.5v1M12 13v1M9.8 11.75h1M13.2 11.75h1"/><path d="M7.5 18.5V20M16.5 18.5V20"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 4v4M15 4v4"/><path d="M7 8h10v3a5 5 0 0 1-10 0z"/><path d="M12 16v4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5M10 11v5M14 11v5"/></symbol>
    <symbol id="i-account" viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5.5 19a6.5 6.5 0 0 1 13 0"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="11" height="11" rx="2.5"/><path d="M14.5 10.5l6-3v9l-6-3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/></symbol>
    <symbol id="i-panel-close" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/><path d="M16.5 10l-2 2 2 2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6.5 11a5.5 5.5 0 0 0 11 0M12 16.5V20"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4L18 18M6 18l1.6-1.6M16.4 7.6L18 6"/></symbol>
    <symbol id="i-panel-right" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15"/></symbol>

    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></symbol>

        </defs>
  </svg>
  <div id="app" class="lf">
    <aside class="lf-side" id="sidebar" aria-label="Conversas e assistentes">
      <div class="lf-brand"><span class="hx-mark hx-22" aria-hidden="true"></span><span class="sb-brand-name">HELIOS</span></div>
      <div class="lf-newrow">
        <button type="button" class="lf-new" id="lfNew" title="Novo agente (Ctrl N)"><svg class="sb-ico"><use href="#i-plus"/></svg><span>Novo agente</span></button>
        <button type="button" class="lf-newmenu" id="lfNewMenu" aria-haspopup="menu" aria-expanded="false" title="Mais" aria-label="Mais opções"><svg class="sb-ico"><use href="#i-chevron-down"/></svg></button>
        <div class="lf-menu" id="lfMenu" role="menu" hidden>
          <button type="button" role="menuitem" id="lfNewChat"><svg class="sb-ico"><use href="#i-spark"/></svg>Nova conversa</button>
          <button type="button" role="menuitem" data-lf-go="time"><svg class="sb-ico"><use href="#i-team"/></svg>Montar time</button>
          <button type="button" role="menuitem" data-lf-go="assistants"><svg class="sb-ico"><use href="#i-bot"/></svg>Gerenciar assistentes</button>
        </div>
      </div>
      <label class="lf-search"><svg class="sb-ico"><use href="#i-search"/></svg><input id="lfSearch" type="search" placeholder="Buscar" aria-label="Buscar conversas"></label>
      <div class="lf-scroll">
        <p class="lf-lbl">Agentes</p>
        <div id="lfChefeAgents" class="lf-list lf-chefe-agents" aria-label="Agentes do Chefe"></div>
        <div id="lfAssistants" class="lf-list lf-assistants-slim" hidden></div>
        <div id="lfConvs" class="lf-list"></div>
      </div>
      <nav class="lf-foot" aria-label="Comando, decisões e ajustes">
        <button type="button" class="lf-it" data-view="chefe" id="lfChefe"><svg class="sb-ico"><use href="#i-spark"/></svg><span>Chefe</span><span class="badge hidden" id="chefeBadge" aria-live="polite"></span></button>
        <button type="button" class="lf-it meeting-open" id="openMeeting" title="Modo de reunião: tradução, sugestões e livecoding (janela à parte)"><svg class="sb-ico"><use href="#i-video"/></svg><span>Modo de reunião</span></button>
        <button type="button" class="lf-it" data-view="inbox" title="Aprovações e perguntas que precisam de você"><svg class="sb-ico"><use href="#i-inbox"/></svg><span>Decisões</span><span class="badge hidden" id="inboxBadge" aria-live="polite"></span></button>
        <button type="button" class="lf-it" id="lfSettings" data-view-x="settings"><svg class="sb-ico"><use href="#i-gear"/></svg><span>Ajustes</span></button>
      </nav>
      <nav class="lf-legacy" hidden aria-hidden="true">
        <button type="button" data-view="chefe" tabindex="-1" class="active">Chefe</button>
        <button type="button" data-view="chat" tabindex="-1">Conversas</button>
        <button type="button" data-view="assistants" tabindex="-1">Assistentes</button>
        <button type="button" data-view="time" tabindex="-1">Montar time</button>
        <button type="button" data-view="search" tabindex="-1">Pesquisa</button>
        <button type="button" data-view="oasis" tabindex="-1">Oasis</button>
        <button type="button" data-view="portfolio" tabindex="-1">Portfólio</button>
        <button type="button" data-view="vagas" tabindex="-1">Vagas</button>
        <button type="button" data-view="routines" tabindex="-1">Rotinas</button>
        <button type="button" data-view="gatilhos" tabindex="-1">Gatilhos</button>
        <button type="button" data-view="ditado" tabindex="-1">Voz</button>
        <button type="button" data-view="activity" tabindex="-1">Atividade<span class="badge hidden" id="activityBadge"></span></button>
        <button type="button" data-view="memory" tabindex="-1">Memória</button>
        <button type="button" data-view="brain" tabindex="-1">Second Brain</button>
        <button type="button" data-view="autonomy" tabindex="-1">Autonomia</button>
        <button type="button" data-view="vault" tabindex="-1">Cofre</button>
        <button type="button" data-view="mcp" tabindex="-1">Conectores</button>
        <button type="button" data-view="context" tabindex="-1">Contexto</button>
        <button type="button" data-view="account" tabindex="-1">Conta</button>
      </nav>
    </aside>

    <main class="lf-main">
      <header class="lf-top">
        <div class="heading"><h1 id="title">Conversas</h1><p class="eyebrow" id="eyebrow" hidden>HELIOS</p></div>
        <div id="solarBar" class="solar-bar" hidden></div>
        <button type="button" class="lf-tbtn sb-js-theme" title="Alternar tema (Ctrl Shift L)" aria-label="Alternar tema (atual: escuro)"><svg class="sb-ico sb-ico-theme"><use href="#i-moon"/></svg></button>
        <button type="button" class="lf-tbtn" id="lfPanelToggle" title="Painel (Ctrl .)" aria-controls="lfRight" aria-expanded="true"><svg class="sb-ico"><use href="#i-panel-right"/></svg></button>
      </header>
      <p id="banner" class="banner hidden" role="status"></p>
      <div id="viewHost" class="lf-viewhost"><div id="view" aria-live="polite"></div></div>
    </main>
    <div class="lf-toast" id="lfToast" role="status" hidden><span id="lfToastMsg"></span><button type="button" id="lfToastUndo">Desfazer</button></div>

    <aside class="lf-right" id="lfRight" aria-label="Painel">
      <div class="lf-tabs" role="tablist">
        <button type="button" role="tab" data-lf-tab="detalhes" class="on">Detalhes</button>
        <button type="button" role="tab" data-lf-tab="biblioteca">Biblioteca</button>
        <button type="button" role="tab" data-lf-tab="atividade">Atividade</button>
      </div>
      <div id="lfRightBody" class="lf-rbody"></div>
    </aside>
  </div>

  <div class="lf-ov" id="lfModal" hidden>
    <div class="lf-modal" role="dialog" aria-modal="true" aria-labelledby="lfModalTitle">
      <nav class="lf-mnav" id="lfMnav" aria-label="Ajustes">
        <p class="lf-lbl" id="lfModalTitle">Ajustes</p>
        <button type="button" data-set="account">Conta</button>
        <button type="button" data-set="aparencia">Aparência</button>
        <button type="button" data-set="autonomy">Autonomia</button>
        <details class="lf-adv" id="lfAdv">
          <summary>Avançado</summary>
          <button type="button" data-set="context">Contexto</button>
          <button type="button" data-set="memory">Memória</button>
          <button type="button" data-set="routines">Rotinas</button>
          <button type="button" data-set="gatilhos">Gatilhos</button>
          <button type="button" data-set="vagas">Vagas</button>
          <button type="button" data-set="vault">Cofre</button>
          <button type="button" data-set="mcp">Conectores</button>
          <button type="button" data-set="ditado">Voz</button>
          <button type="button" data-set="activity">Atividade</button>
          <button type="button" data-set="reuniao">Reunião</button>
          <button type="button" data-set="time">Montar time</button>
        </details>
      </nav>
      <div class="lf-mbody" id="lfModalBody"><div id="lfAppearance" hidden></div><div id="lfMeeting" hidden></div></div>
      <button type="button" class="lf-close" id="lfModalClose" aria-label="Fechar ajustes" title="Fechar (Esc)"><svg class="sb-ico"><use href="#i-close"/></svg></button>
    </div>
  </div>

  <div class="sb-tip" id="sbTip" hidden role="tooltip"><span class="sb-tip-text"></span><span class="sb-tip-keys"></span></div>
  <p class="sr-only" id="sbLive" role="status" aria-live="polite"></p>
  <script src="details-state.js"></script>
  <script src="voice.js"></script>
  <script src="contexto.js"></script>
  <script src="contas.js"></script>
  <script src="uso-bar.js"></script>
  <script src="conectores.js"></script>
  <script src="app.js"></script>
  <script src="layout.js"></script>
  <script src="agents.js"></script>
  <script src="chefe.js"></script>
</body>
</html>
